<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080812;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  max-width:500px;
  margin:auto;
  min-height:100vh;
  padding-bottom:30px;
}

header{
  padding:20px;
  background:#15152a;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.card{
  margin:16px;
  padding:20px;
  border-radius:20px;
  background:#15151f;
}

h2{margin-top:0}

input,textarea{
  width:100%;
  padding:14px;
  margin:7px 0 12px;
  border:0;
  outline:none;
  border-radius:10px;
  background:#24243a;
  color:white;
  font-size:16px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#ffc400;
  color:#111;
  font-size:16px;
  font-weight:bold;
  margin-top:5px;
}

button:active{
  transform:scale(.98);
}

.logout{
  background:#292936;
  color:white;
}

.hidden{
  display:none!important;
}

.status{
  text-align:center;
  padding:10px;
  color:#42e69a;
}

.error{
  color:#ff6868;
  text-align:center;
  padding:10px;
}

.success{
  color:#42e69a;
  text-align:center;
  padding:10px;
}

.item{
  padding:14px 5px;
  border-bottom:1px solid #292936;
}

.item:last-child{
  border-bottom:0;
}

.item b{
  color:#ffc400;
}

.small{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

.connection{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#202035;
  font-size:13px;
  color:#aaa;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="app">

<header>
🔐 ADMIN PANEL
</header>


<!-- LOGIN -->

<div id="loginBox" class="card">

<h2>Admin Login</h2>

<input
type="email"
id="email"
placeholder="Email"
autocomplete="username"
>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password"
>

<button id="loginButton">
🔐 Login
</button>

<div id="loginStatus"></div>

<div class="connection">
Supabase:
<br>
acclbthzfzrfbwyslpvv.supabase.co
</div>

</div>


<!-- ADMIN -->

<div id="adminBox" class="hidden">

<div class="status">
🟢 Admin Login ဝင်ထားပါတယ်
</div>


<!-- 3D -->

<div class="card">

<h2>🔢 3D Result</h2>

<input
type="date"
id="threeDDate"
>

<input
type="text"
id="threeDValue"
maxlength="3"
inputmode="numeric"
placeholder="3D ဂဏန်း ဥပမာ 123"
>

<button id="save3DButton">
💾 3D Result သိမ်းမယ်
</button>

<div id="threeDStatus"></div>

</div>


<!-- NOTIFICATION -->

<div class="card">

<h2>🔔 Notification</h2>

<input
type="text"
id="noticeTitle"
placeholder="ခေါင်းစဉ်"
>

<textarea
id="noticeText"
placeholder="ကြော်ငြာစာ / Notification စာ"
></textarea>

<button id="saveNoticeButton">
📢 Notification တင်မယ်
</button>

<div id="noticeStatus"></div>

</div>


<!-- CALENDAR -->

<div class="card">

<h2>📅 Calendar Result</h2>

<input
type="date"
id="calendarDate"
>

<input
type="text"
id="calendarValue"
maxlength="2"
inputmode="numeric"
placeholder="2D ဂဏန်း ဥပမာ 80"
>

<button id="saveCalendarButton">
💾 Calendar Result သိမ်းမယ်
</button>

<div id="calendarStatus"></div>

</div>


<!-- CONTENT -->

<div class="card">

<h2>📋 သိမ်းထားတာများ</h2>

<div id="contentList">
Loading...
</div>

</div>


<div class="card">

<button
class="logout"
id="logoutButton"
>
🚪 Logout
</button>

</div>

</div>

</div>


<script type="module">

/* =========================================
   SUPABASE
========================================= */

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
"https://acclbthzfzrfbwyslpvv.supabase.co";


const SUPABASE_KEY =
"sb_publishable_PxrCIfh0MfL6KT1iQxgqfw__IgNG1OY";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const loginButton =
document.getElementById("loginButton");

const loginStatus =
document.getElementById("loginStatus");


/* =========================================
   LOGIN
========================================= */

loginButton.addEventListener(
"click",
async function(){

  const email =
  document
  .getElementById("email")
  .value
  .trim();

  const password =
  document
  .getElementById("password")
  .value;


  if(!email || !password){

    loginStatus.className="error";

    loginStatus.innerText=
    "❌ Email နဲ့ Password ထည့်ပါ";

    return;
  }


  loginStatus.className="";

  loginStatus.innerText=
  "🔄 Supabase ကို ချိတ်နေပါတယ်...";


  try{

    const {
      data,
      error
    } =
    await supabase.auth.signInWithPassword({
      email:email,
      password:password
    });


    if(error){

      console.error(error);

      loginStatus.className="error";

      loginStatus.innerText=
      "❌ " + error.message;

      return;
    }


    if(!data.session){

      loginStatus.className="error";

      loginStatus.innerText=
      "❌ Login Session မရပါ";

      return;
    }


    loginStatus.className="success";

    loginStatus.innerText=
    "✅ Login အောင်မြင်ပါတယ်";


    showAdmin();

  }
  catch(error){

    console.error(error);

    loginStatus.className="error";

    loginStatus.innerHTML=
    "❌ Failed to fetch<br><br>"+
    "Supabase connection ကို စစ်ပါ";

  }

});


/* =========================================
   SHOW ADMIN
========================================= */

function showAdmin(){

  document
  .getElementById("loginBox")
  .classList.add("hidden");

  document
  .getElementById("adminBox")
  .classList.remove("hidden");

  loadContent();

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkLogin(){

  try{

    const {
      data,
      error
    } =
    await supabase.auth.getSession();


    if(error){

      console.error(error);

      return;
    }


    if(data.session){

      showAdmin();

    }

  }
  catch(error){

    console.error(
      "Session Error:",
      error
    );

  }

}

checkLogin();


/* =========================================
   3D SAVE
========================================= */

document
.getElementById("save3DButton")
.addEventListener(
"click",
async function(){

  const date =
  document
  .getElementById("threeDDate")
  .value;

  const value =
  document
  .getElementById("threeDValue")
  .value
  .trim();

  const status =
  document
  .getElementById("threeDStatus");


  if(!date || !value){

    status.className="error";

    status.innerText=
    "❌ Date နဲ့ 3D ဂဏန်း ထည့်ပါ";

    return;
  }


  if(!/^\d{3}$/.test(value)){

    status.className="error";

    status.innerText=
    "❌ 3D က ဂဏန်း 3 လုံး ဖြစ်ရမယ်";

    return;
  }


  status.className="";

  status.innerText=
  "🔄 သိမ်းနေပါတယ်...";


  try{

    const {
      error
    } =
    await supabase
    .from("admin_content")
    .insert({

      content_type:"3d",

      content_date:date,

      title:"3D Result",

      content:value

    });


    if(error){

      throw error;
    }


    status.className="success";

    status.innerText=
    "✅ 3D Result သိမ်းပြီးပါပြီ";

    document
    .getElementById("threeDValue")
    .value="";


    loadContent();

  }
  catch(error){

    console.error(error);

    status.className="error";

    status.innerText=
    "❌ " + error.message;

  }

});


/* =========================================
   NOTIFICATION
========================================= */

document
.getElementById("saveNoticeButton")
.addEventListener(
"click",
async function(){

  const title =
  document
  .getElementById("noticeTitle")
  .value
  .trim();

  const text =
  document
  .getElementById("noticeText")
  .value
  .trim();

  const status =
  document
  .getElementById("noticeStatus");


  if(!title || !text){

    status.className="error";

    status.innerText=
    "❌ ခေါင်းစဉ်နဲ့ စာ ထည့်ပါ";

    return;
  }


  status.innerText=
  "🔄 တင်နေပါတယ်...";


  try{

    const {
      error
    } =
    await supabase
    .from("admin_content")
    .insert({

      content_type:"notification",

      title:title,

      content:text

    });


    if(error){

      throw error;

    }


    status.className="success";

    status.innerText=
    "✅ Notification တင်ပြီးပါပြီ";


    document
    .getElementById("noticeTitle")
    .value="";

    document
    .getElementById("noticeText")
    .value="";


    loadContent();

  }
  catch(error){

    console.error(error);

    status.className="error";

    status.innerText=
    "❌ " + error.message;

  }

});


/* =========================================
   CALENDAR SAVE
========================================= */

document
.getElementById("saveCalendarButton")
.addEventListener(
"click",
async function(){

  const date =
  document
  .getElementById("calendarDate")
  .value;

  const value =
  document
  .getElementById("calendarValue")
  .value
  .trim();

  const status =
  document
  .getElementById("calendarStatus");


  if(!date || !value){

    status.className="error";

    status.innerText=
    "❌ Date နဲ့ 2D ဂဏန်း ထည့်ပါ";

    return;
  }


  if(!/^\d{2}$/.test(value)){

    status.className="error";

    status.innerText=
    "❌ 2D က ဂဏန်း 2 လုံး ဖြစ်ရမယ်";

    return;
  }


  status.className="";

  status.innerText=
  "🔄 သိမ်းနေပါတယ်...";


  try{

    const {
      error
    } =
    await supabase
    .from("admin_content")
    .insert({

      content_type:"calendar",

      content_date:date,

      title:"2D Result",

      content:value

    });


    if(error){

      throw error;

    }


    status.className="success";

    status.innerText=
    "✅ Calendar Result သိမ်းပြီးပါပြီ";


    document
    .getElementById("calendarValue")
    .value="";


    loadContent();

  }
  catch(error){

    console.error(error);

    status.className="error";

    status.innerText=
    "❌ " + error.message;

  }

});


/* =========================================
   LOAD CONTENT
========================================= */

async function loadContent(){

  const box =
  document
  .getElementById("contentList");


  box.innerHTML=
  "🔄 Loading...";


  try{

    const {
      data,
      error
    } =
    await supabase
    .from("admin_content")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(30);


    if(error){

      throw error;

    }


    if(!data || !data.length){

      box.innerHTML=
      "📭 Data မရှိသေးပါ";

      return;
    }


    box.innerHTML="";


    data.forEach(
    function(item){

      const div =
      document.createElement("div");

      div.className="item";


      div.innerHTML=

      "<b>"+
      (item.content_type || "")+
      "</b><br>"+

      (item.title || "")+
      "<br>"+

      (item.content || "")+

      '<div class="small">'+
      (item.content_date || "")+
      "</div>";


      box.appendChild(div);

    });

  }
  catch(error){

    console.error(error);

    box.innerHTML=
    '<div class="error">'+
    "❌ "+error.message+
    "</div>";

  }

}


/* =========================================
   LOGOUT
========================================= */

document
.getElementById("logoutButton")
.addEventListener(
"click",
async function(){

  await supabase.auth.signOut();

  location.reload();

});

</script>

</body>
</html>
