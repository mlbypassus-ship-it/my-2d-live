<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://acclbthzfzrfbwyslpvv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PxrCIfh0MfL6KT1iQxgqfw__IgNG1OY";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

window.login = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const status =
    document.getElementById("loginStatus");

  if(!email || !password){
    status.innerText =
      "⚠️ Email နဲ့ Password ထည့်ပါ";
    return;
  }

  status.innerText =
    "🔄 Supabase ကို ချိတ်နေပါတယ်...";

  try {

    const { data, error } =
      await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(error){
      status.className = "error";
      status.innerText =
        "❌ " + error.message;
      return;
    }

    if(!data.session){
      status.className = "error";
      status.innerText =
        "❌ Login session မရပါ";
      return;
    }

    status.className = "status";
    status.innerText =
      "✅ Login အောင်မြင်ပါတယ်";

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");

  } catch(e){

    console.error(e);

    status.className = "error";

    status.innerHTML =
      "❌ Supabase ကို ချိတ်မရပါ<br><br>" +
      "URL / Internet / GitHub Pages ကို စစ်ပါ";
  }
};

</script>
