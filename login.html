<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b16">

<title>MM-Real-Earn • Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 20% 10%,#17315c55,transparent 30%),
    radial-gradient(circle at 90% 30%,#5c2b7650,transparent 30%),
    linear-gradient(180deg,#0b1020,#070a12);
  color:#fff;
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
}

.login{
  width:calc(100% - 32px);
  max-width:420px;
  padding:30px 22px;
  border-radius:28px;
  background:#111827dd;
  border:1px solid #ffffff12;
  box-shadow:0 25px 70px #0008;
  text-align:center;
}

.logo{
  width:72px;
  height:72px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  font-size:38px;
  background:linear-gradient(135deg,#ffd43b,#ff8a00);
  box-shadow:0 15px 40px #ff9d0033;
}

h1{
  margin-top:20px;
  font-size:25px;
}

.sub{
  margin-top:9px;
  color:#8f98aa;
  font-size:13px;
  line-height:1.7;
}

.google{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:1px solid #ffffff15;
  border-radius:15px;
  background:#fff;
  color:#111;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.google:disabled{
  opacity:.55;
}

.status{
  min-height:22px;
  margin-top:15px;
  color:#9da5b7;
  font-size:12px;
  line-height:1.6;
}

.note{
  margin-top:22px;
  padding:13px;
  border-radius:14px;
  background:#ffffff08;
  color:#777f92;
  font-size:11px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="login">

  <div class="logo">
    🪙
  </div>

  <h1>MM-Real-Earn</h1>

  <div class="sub">
    Earn • Play • Reward
    <br>
    Google Account ဖြင့် Login ဝင်ပါ
  </div>

  <button
    class="google"
    id="googleBtn"
    onclick="googleLogin()">

    🔵 Continue with Google

  </button>

  <div
    class="status"
    id="status">
  </div>

  <div class="note">
    Google Account တစ်ခုစီအတွက်
    Coin Balance ကို သီးခြားသိမ်းဆည်းထားပါမယ်။
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://acclbthzfzrfbwyslpvv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PxrCIfh0MfL6KT1iQxgqfw__IgNG1OY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   STATUS
========================= */

function showStatus(text,color="#9da5b7"){

  const status =
    document.getElementById("status");

  status.innerText = text;
  status.style.color = color;

}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();


  if(error){

    console.error(error);
    return;

  }


  if(data.session){

    window.location.replace(
      "index.html"
    );

  }

}


/* =========================
   GOOGLE LOGIN
========================= */

async function googleLogin(){

  const button =
    document.getElementById(
      "googleBtn"
    );


  button.disabled = true;

  showStatus(
    "🔄 Google Login ဖွင့်နေပါတယ်..."
  );


  const {
    error
  } =
  await supabaseClient.auth.signInWithOAuth({

    provider:"google",

    options:{

      redirectTo:
        "https://mlbypassus-ship-it.github.io/my-2d-live/index.html"

    }

  });


  if(error){

    console.error(error);

    button.disabled = false;

    showStatus(
      "❌ Login မအောင်မြင်ပါ။ " +
      error.message,
      "#ff6868"
    );

  }

}


/* =========================
   AUTH LISTENER
========================= */

supabaseClient.auth.onAuthStateChange(
  function(event,session){

    if(
      event === "SIGNED_IN" &&
      session
    ){

      window.location.replace(
        "index.html"
      );

    }

  }
);


/* =========================
   START
========================= */

checkLogin();

</script>

</body>
</html>
