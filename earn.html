<title>MM-Real-Earn • Earn Video</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#070a12;
  color:#fff;
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
}

.app{
  max-width:500px;
  min-height:100vh;
  margin:auto;
  padding-bottom:30px;

  background:
  radial-gradient(circle at 20% 10%,#17315c55,transparent 30%),
  radial-gradient(circle at 90% 30%,#5c2b7650,transparent 30%),
  linear-gradient(180deg,#0b1020,#070a12);
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;

  padding:15px 16px;

  background:#0b1020ee;
  backdrop-filter:blur(15px);

  border-bottom:1px solid #ffffff12;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.back{
  border:0;
  background:#ffffff0d;
  color:#fff;

  padding:10px 13px;
  border-radius:12px;

  font-size:14px;
}

.header-title{
  font-weight:bold;
  font-size:16px;
}

.coin-box{
  display:flex;
  align-items:center;
  gap:6px;

  padding:9px 12px;

  border-radius:13px;

  background:#ffffff0c;
  border:1px solid #ffffff12;
}

.coin{
  color:#ffd43b;
  font-weight:bold;
}

/* HERO */

.hero{
  margin:16px;
  padding:24px 20px;

  border-radius:24px;

  background:
  radial-gradient(circle at 80% 20%,#ffd43b20,transparent 30%),
  linear-gradient(135deg,#171d35,#101522);

  border:1px solid #ffffff12;
}

.hero-icon{
  width:55px;
  height:55px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:17px;

  background:linear-gradient(
    135deg,
    #ff3030,
    #ff0000
  );

  font-size:27px;

  box-shadow:0 10px 30px #ff000033;
}

.hero h1{
  margin-top:15px;
  font-size:23px;
}

.hero p{
  margin-top:8px;

  color:#9da5b7;

  font-size:13px;
  line-height:1.7;
}

/* VIDEO */

.video-card{
  margin:16px;
  padding:16px;

  border-radius:22px;

  background:#ffffff08;

  border:1px solid #ffffff0d;
}

.video-title{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:13px;
}

.video-title h2{
  font-size:17px;
}

.video-title span{
  color:#ffd43b;
  font-size:12px;
}

/* VIDEO BOX */

.video-box{
  width:100%;
  aspect-ratio:16/9;

  overflow:hidden;

  border-radius:17px;

  background:#000;

  border:1px solid #ffffff12;
}

#youtubePlayer{
  width:100%;
  height:100%;
}

/* INFO */

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:10px;

  margin-top:14px;
}

.info{
  padding:14px;

  border-radius:15px;

  background:#ffffff08;

  border:1px solid #ffffff0d;
}

.info small{
  color:#818a9d;
  font-size:11px;
}

.info strong{
  display:block;

  margin-top:5px;

  font-size:18px;
}

.info .gold{
  color:#ffd43b;
}

/* PROGRESS */

.progress-box{
  margin:16px;

  padding:20px;

  border-radius:22px;

  background:linear-gradient(
    135deg,
    #121a2c,
    #171226
  );

  border:1px solid #ffffff0d;
}

.progress-top{
  display:flex;
  justify-content:space-between;
}

.progress-top h2{
  font-size:17px;
}

.progress-top span{
  color:#ffd43b;
  font-size:12px;
}

.progress{
  height:9px;

  margin-top:15px;

  border-radius:10px;

  background:#ffffff0d;

  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;

  background:
  linear-gradient(
    90deg,
    #ffd43b,
    #ff8a00
  );

  transition:.3s;
}

.progress-info{
  display:flex;
  justify-content:space-between;

  margin-top:9px;

  color:#858ea1;

  font-size:11px;
}

/* WATCH BUTTON */

.watch-button{
  width:100%;

  margin-top:16px;

  padding:15px;

  border:0;
  border-radius:14px;

  background:
  linear-gradient(
    135deg,
    #ffd43b,
    #ff9800
  );

  color:#111;

  font-size:15px;
  font-weight:bold;
}

.watch-button:disabled{
  opacity:.45;
}

/* STATUS */

.status{
  text-align:center;

  margin-top:12px;

  min-height:22px;

  color:#9da5b7;

  font-size:12px;

  line-height:1.6;
}

</style>

</head>

<section class="progress-box">

  <div class="progress-info">

    <span>
      Video ကြည့်ပြီးစီးမှု
    </span>

    <span id="progressCount">

    </span>

  </div>

</section>

</div>


<script>

/* =========================
   SETTINGS
========================= */

const DAILY_LIMIT = 30;


/* =========================
   RANDOM REWARD
========================= */

const REWARDS = [
  100,
  200,
  300,
  400,
  500,
  700,
  800,
  1000,
  1500,
  2000
];


/* =========================
   VIDEO STORAGE
========================= */

let videoCount =
  Number(
    localStorage.getItem(
      "mm_video_count"
    ) || 0
  );


let videoDate =
  localStorage.getItem(
    "mm_video_date"
  );


/* =========================
   YOUTUBE
========================= */

let ytPlayer = null;

let rewardTimer = null;

let rewardStarted = false;

let rewardClaimed = false;


/* =========================
   YOUTUBE API READY
========================= */

function onYouTubeIframeAPIReady(){

  ytPlayer =
    new YT.Player(
      "youtubePlayer",
      {
        videoId:"ha7t8JdMl94",

        playerVars:{
          autoplay:0,
          controls:1,
          rel:0,
          playsinline:1
        },

        events:{
          onReady:
            onPlayerReady,

          onStateChange:
            onPlayerStateChange
        }

      }
    );

}


/* =========================
   PLAYER READY
========================= */

function onPlayerReady(){

  const status =
    document.getElementById(
      "watchStatus"
    );

  status.innerText =
    "▶️ Watch ခလုတ်ကိုနှိပ်ပြီး Video စတင်ကြည့်ပါ။";

}


/* =========================
   PLAYER STATE
========================= */

function onPlayerStateChange(event){

  const button =
    document.getElementById(
      "watchButton"
    );

  const status =
    document.getElementById(
      "watchStatus"
    );


  /* =====================
     PLAYING
  ===================== */

  if(
    event.data ===
    YT.PlayerState.PLAYING
  ){

    if(!rewardStarted){

      rewardStarted = true;

      let seconds = 10;

      button.disabled = true;

      status.style.color =
        "#ffd43b";

      status.innerText =
        "▶️ Video ကြည့်နေပါသည်... " +
        seconds +
        "s";


      rewardTimer =
        setInterval(
          function(){

            seconds--;


            if(seconds > 0){

              status.innerText =
                "▶️ Video ကြည့်နေပါသည်... " +
                seconds +
                "s";

            }else{

              clearInterval(
                rewardTimer
              );

              rewardTimer = null;

              giveVideoReward();

            }

          },
          1000
        );

    }

  }


  /* =====================
     PAUSED
  ===================== */

  if(
    event.data ===
    YT.PlayerState.PAUSED
  ){

    if(
      rewardStarted &&
      !rewardClaimed
    ){

      clearInterval(
        rewardTimer
      );

      rewardTimer = null;

      rewardStarted = false;

      button.disabled = false;

      button.innerText =
        "▶️ Video ပြန်ဖွင့်မယ်";

      status.style.color =
        "#ffcc66";

      status.innerText =
        "⏸️ Video ရပ်ထားပါတယ်။ ပြန်ဖွင့်ပြီး ဆက်ကြည့်ပါ။";

    }

  }


  /* =====================
     ENDED
  ===================== */

  if(
    event.data ===
    YT.PlayerState.ENDED
  ){

    clearInterval(
      rewardTimer
    );

    rewardTimer = null;

    if(
      rewardStarted &&
      !rewardClaimed
    ){

      giveVideoReward();

    }

  }

}


/* =========================
   NEW DAY
========================= */

function checkNewDay(){

  const today =
    new Date()
      .toLocaleDateString();


  if(videoDate !== today){

    videoDate = today;

    videoCount = 0;


    localStorage.setItem(
      "mm_video_date",
      today
    );


    localStorage.setItem(
      "mm_video_count",
      "0"
    );

  }

}


/* =========================
   COIN
========================= */

function getCoins(){

  return Number(
    localStorage.getItem(
      "mm_real_earn_coins"
    ) || 0
  );

}


function updateCoinDisplay(){

  const coins =
    getCoins();


  const coinBalance =
    document.getElementById(
      "coinBalance"
    );


  if(coinBalance){

    coinBalance.innerText =
      coins.toLocaleString();

  }


  const videoCoinBalance =
    document.getElementById(
      "videoCoinBalance"
    );


  if(videoCoinBalance){

    videoCoinBalance.innerText =
      coins.toLocaleString();

  }

}


/* =========================
   ADD COIN
========================= */

function addCoin(amount){

  let coins =
    getCoins();


  coins +=
    Number(amount);


  localStorage.setItem(
    "mm_real_earn_coins",
    coins
  );


  updateCoinDisplay();

}


/* =========================
   UPDATE UI
========================= */

function updateUI(){

  checkNewDay();


  document.getElementById(
    "videoCount"
  ).innerText =
    videoCount +
    " / " +
    DAILY_LIMIT;


  document.getElementById(
    "progressCount"
  ).innerText =
    videoCount +
    " / " +
    DAILY_LIMIT;


  const percent =
    Math.min(
      100,
      (videoCount /
      DAILY_LIMIT) * 100
    );


  document.getElementById(
    "progressBar"
  ).style.width =
    percent + "%";


  document.getElementById(
    "progressText"
  ).innerText =
    Math.round(percent) +
    "%";


  updateCoinDisplay();


  const button =
    document.getElementById(
      "watchButton"
    );


  if(
    videoCount >=
    DAILY_LIMIT
  ){

    button.disabled = true;

    button.innerText =
      "✅ ဒီနေ့ Reward ပြည့်ပါပြီ";

  }

}


/* =========================
   WATCH BUTTON
========================= */

function claimReward(){

  checkNewDay();


  if(
    videoCount >=
    DAILY_LIMIT
  ){

    updateUI();

    return;

  }


  if(!ytPlayer){

    document.getElementById(
      "watchStatus"
    ).innerText =
      "⏳ YouTube Video ပြင်ဆင်နေပါသည်...";

    return;

  }


  rewardStarted = false;

  rewardClaimed = false;


  const button =
    document.getElementById(
      "watchButton"
    );


  const status =
    document.getElementBy
